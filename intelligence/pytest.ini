[pytest]
testpaths = tests
python_files = test_*.py
addopts =
    --ignore=tests/layer4/test_layer4_runtime_e2e.py
    --ignore=tests/layer4/test_layer4_supabase_readonly.py
markers =
    live_supabase: requires an explicitly approved live Supabase connection
    real_prescription: processes a private or real prescription document
    database_write: can insert or update database records
    ocr_runtime: initializes the real OCR runtime and model assets
